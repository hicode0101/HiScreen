<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HiScreen · 局域网屏幕分享</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1.5' y='1.5' width='21' height='21' rx='5' fill='%230067c0'/%3E%3Crect x='5' y='5.5' width='14' height='9.5' rx='1.6' stroke='%23fff' stroke-width='1.7' fill='none'/%3E%3Cpath d='M10.3 8.1 14.2 10.25 10.3 12.4z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #101010;
    --bar: #161616;
    --line: rgba(255, 255, 255, 0.09);
    --panel: rgba(32, 32, 32, 0.92);
    --text: #f5f5f5;
    --text-dim: rgba(255, 255, 255, 0.55);
    --accent: #4cc2ff;
    --ok: #6ccb5f;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: 13.5px;
    user-select: none;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 46px;
    padding: 0 14px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; }
  .brand .logo {
    width: 22px; height: 22px; border-radius: 5px; background: #0067c0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .brand .logo svg { width: 15px; height: 15px; }
  .pill {
    margin: 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 999px;
    color: var(--text-dim);
    font-size: 12.5px;
    max-width: 60vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #6e6e6e; flex-shrink: 0; }
  .pill.live .dot { background: var(--ok); box-shadow: 0 0 6px rgba(108, 203, 95, 0.8); }
  .pill.live { color: var(--text); }

  /* ---------- stage ---------- */
  #stage {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    outline: none;
  }
  #waiting {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #000;
    color: var(--text-dim);
    transition: opacity 0.25s ease;
  }
  #waiting.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255, 255, 255, 0.14);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #conn-state { font-size: 12px; color: var(--text-dim); }

  /* ---------- toolbar ---------- */
  #toolbar {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 10px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    transition: opacity 0.2s ease;
  }
  .stat {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px;
    color: var(--text-dim);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stat svg { opacity: 0.8; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
  .tbtn {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .tbtn:hover { background: rgba(255, 255, 255, 0.09); }
  .tbtn.off { color: var(--text-dim); }
  #volume {
    width: 110px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  button { font-family: inherit; }

  /* ---------- toasts ---------- */
  #toasts {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    z-index: 50;
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    font-size: 13px;
    max-width: min(480px, 86vw);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    animation: toast-in 0.25s ease;
  }
  .toast-icon {
    display: inline-flex;
    color: var(--accent);
    flex-shrink: 0;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }

  @media (max-width: 640px) {
    .brand span { display: none; }
    #volume { width: 70px; }
    .stat.opt { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="5" width="15" height="10" rx="1.5"/>
          <path d="M9.8 19h4.4M12 15v4"/>
        </svg>
      </span>
      <span>HiScreen</span>
    </div>
    <div class="pill" id="pill">
      <span class="dot"></span>
      <span id="pill-text">—</span>
    </div>
  </header>

  <div id="stage">
    <canvas id="video" width="0" height="0"></canvas>
    <div id="waiting">
      <div class="spinner"></div>
      <div id="waiting-text">等待主机开始分享…</div>
      <div id="conn-state"></div>
    </div>

    <div id="toolbar">
      <span class="stat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 3 5 13.5h6L11 21l8-10.5h-6z"/></svg><span id="stat-fps">— FPS</span></span>
      <span class="stat opt" id="stat-res-wrap"><span id="stat-res">—</span></span>
      <span class="stat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 3a9 9 0 0 1 8 8M13 8a4.2 4.2 0 0 1 3 4"/><circle cx="4" cy="17" r="2.6"/></svg><span id="stat-rtt">— ms</span></span>
      <div class="sep"></div>
      <button class="tbtn off" id="btn-mute" title="声音"></button>
      <input type="range" id="volume" min="0" max="100" value="80" />
      <div class="sep"></div>
      <button class="tbtn" id="btn-shot" title="截图"></button>
      <button class="tbtn" id="btn-fs" title="全屏"></button>
    </div>

    <div id="toasts"></div>
  </div>

<script>
(function () {
  "use strict";

  var LANG = (navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  var I18N = {
    zh: {
      waiting: "等待主机开始分享…",
      disconnected: "连接已断开",
      reconnecting: "已断开，正在重连…",
      primary: "主显示器",
      idle: "未在分享",
      muted: "开启声音",
      unmuteHint: "点击工具栏扬声器开启声音",
      notice: "广播通知",
      saved: "截图已保存",
      shotFail: "截图失败",
      display: "显示器",
    },
    en: {
      waiting: "Waiting for the host to start sharing…",
      disconnected: "Disconnected",
      reconnecting: "Disconnected, reconnecting…",
      primary: "Primary",
      idle: "Not sharing",
      muted: "Enable sound",
      unmuteHint: "Click the speaker in the toolbar to enable sound",
      notice: "Broadcast notice",
      saved: "Screenshot saved",
      shotFail: "Screenshot failed",
      display: "Display",
    },
  };

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("video");
  var ctx = canvas.getContext("2d");
  var pill = $("pill"), pillText = $("pill-text");
  var waiting = $("waiting"), waitingText = $("waiting-text"), connState = $("conn-state");
  var statFps = $("stat-fps"), statRes = $("stat-res"), statRtt = $("stat-rtt");
  var toasts = $("toasts");

  var ICONS = {
    speaker: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5v5h3.1l4.6 3.9V5.6L7.6 9.5H4.5z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>',
    muted: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5v5h3.1l4.6 3.9V5.6L7.6 9.5H4.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
    camera: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.2c0-1 .8-1.8 1.8-1.8h1.9l1.4-1.9h6.8l1.4 1.9h1.9c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H5.8c-1 0-1.8-.8-1.8-1.8z"/><circle cx="12" cy="12.2" r="3.4"/></svg>',
    expand: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  };
  $("btn-shot").innerHTML = ICONS.camera;
  $("btn-fs").innerHTML = ICONS.expand;

  // ---------- state ----------
  var ws = null;
  var sharing = false;
  var metaFps = 0;
  var metaAudio = false;
  var muted = true;
  var volume = 0.8;
  var rtt = null;
  var frameCount = 0;
  var lastShot = null;

  // ---------- websocket ----------
  function connect() {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    try { ws = new WebSocket(proto + location.host + "/ws"); } catch (e) { scheduleReconnect(); return; }
    ws.binaryType = "arraybuffer";
    ws.onopen = function () {
      connState.textContent = "";
      ws.send(JSON.stringify({ type: "hello", os: detectOS(), browser: detectBrowser() }));
    };
    ws.onmessage = onMessage;
    ws.onclose = function () {
      ws = null;
      connState.textContent = I18N[LANG].reconnecting;
      setPillIdle();
      scheduleReconnect();
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function scheduleReconnect() {
    if (!ws) setTimeout(connect, 2000);
  }

  function detectOS() {
    var ua = navigator.userAgent;
    if (/Windows NT/.test(ua)) return "Windows";
    if (/Mac OS X/.test(ua)) return "macOS";
    if (/Android/.test(ua)) return "Android";
    if (/iPhone|iPad/.test(ua)) return "iOS";
    if (/CrOS/.test(ua)) return "ChromeOS";
    if (/Linux/.test(ua)) return "Linux";
    return "Unknown";
  }
  function detectBrowser() {
    var ua = navigator.userAgent;
    if (/Edg\//.test(ua)) return "Edge";
    if (/OPR\//.test(ua)) return "Opera";
    if (/Firefox\//.test(ua)) return "Firefox";
    if (/Chrome\//.test(ua)) return "Chrome";
    if (/Safari\//.test(ua)) return "Safari";
    return "Browser";
  }

  function onMessage(ev) {
    if (typeof ev.data === "string") {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      switch (msg.type) {
        case "meta":
          sharing = !!msg.sharing;
          metaFps = msg.fps || 0;
          metaAudio = !!msg.audio;
          updatePill(msg.display);
          waiting.classList.toggle("hidden", sharing);
          if (sharing && LANG === "zh") waitingText.textContent = I18N.zh.waiting;
          break;
        case "notice":
          showToast(msg.text, msg.duration);
          break;
        case "ping":
          ws.send(JSON.stringify({ type: "pong", t: msg.t }));
          break;
        case "pong":
          if (typeof msg.t === "number") rtt = Date.now() - msg.t;
          break;
      }
      return;
    }
    // binary media frame: [type][payload]
    if (!(ev.data instanceof ArrayBuffer) || ev.data.byteLength < 1) return;
    var arr = new Uint8Array(ev.data);
    if (arr[0] === 1) drawFrame(arr.subarray(1));
    else if (arr[0] === 2) playChunk(decodePcm16(arr.subarray(1)));
  }

  // Reinterpret little-endian i16 bytes as an Int16Array.
  function decodePcm16(bytes) {
    var n = bytes.length & ~1;
    var buf = new ArrayBuffer(n);
    new Uint8Array(buf).set(bytes.subarray(0, n));
    return new Int16Array(buf);
  }

  // ---------- video ----------
  function drawFrame(bytes) {
    var blob = new Blob([bytes], { type: "image/jpeg" });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      if (canvas.width !== img.naturalWidth || canvas.height !== img.naturalHeight) {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        statRes.textContent = img.naturalWidth + "×" + img.naturalHeight;
      }
      ctx.drawImage(img, 0, 0);
      frameCount++;
      URL.revokeObjectURL(url);
    };
    img.onerror = function () { URL.revokeObjectURL(url); };
    img.src = url;
  }

  // ---------- audio ----------
  var audioCtx = null, gainNode = null, nextAt = 0;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC({ sampleRate: 48000 });
      gainNode = audioCtx.createGain();
      gainNode.gain.value = muted ? 0 : volume;
      gainNode.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return true;
  }
  function playChunk(samples) {
    if (!ensureAudio()) return;
    var n = samples.length;
    if (n === 0) return;
    var buf = audioCtx.createBuffer(1, n, 48000);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < n; i++) ch[i] = samples[i] / 32768;
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(gainNode);
    var now = audioCtx.currentTime;
    if (nextAt < now + 0.03) nextAt = now + 0.08; // keep a small jitter buffer
    if (nextAt > now + 0.5) nextAt = now + 0.1;   // recover from backlog
    src.start(nextAt);
    nextAt += buf.duration;
  }

  // ---------- toolbar ----------
  var btnMute = $("btn-mute"), volumeEl = $("volume");
  function renderMute() {
    btnMute.innerHTML = muted ? ICONS.muted : ICONS.speaker;
    btnMute.classList.toggle("off", muted);
    btnMute.title = I18N[LANG].muted;
    if (gainNode) gainNode.gain.value = muted ? 0 : volume;
  }
  btnMute.addEventListener("click", function () {
    muted = !muted;
    if (!muted) ensureAudio();
    renderMute();
  });
  volumeEl.addEventListener("input", function () {
    volume = volumeEl.value / 100;
    if (gainNode) gainNode.gain.value = muted ? 0 : volume;
  });
  renderMute();

  $("btn-shot").addEventListener("click", function () {
    if (!canvas.width) return;
    canvas.toBlob(function (blob) {
      if (!blob) { showToast(I18N[LANG].shotFail); return; }
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      var d = new Date();
      var p = function (x) { return (x < 10 ? "0" : "") + x; };
      a.download = "hiscreen-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + ".png";
      a.click();
      showToast(I18N[LANG].saved);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }, "image/png");
  });

  $("btn-fs").addEventListener("click", function () {
    var stage = $("stage");
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen().catch(function () {});
  });

  // ---------- stats / pings ----------
  setInterval(function () {
    var sent = frameCount;
    statFps.textContent = sent + " FPS";
    if (rtt !== null) statRtt.textContent = rtt + " ms";
    frameCount = 0;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: "stats",
        latency: rtt || 0,
        fps: sent,
        audio: !muted && !!audioCtx,
      }));
      ws.send(JSON.stringify({ type: "ping", t: Date.now() }));
    }
  }, 1000);

  // ---------- pill / waiting ----------
  function setPillIdle() {
    pill.classList.remove("live");
    pillText.textContent = I18N[LANG].idle;
  }
  function updatePill(display) {
    if (!sharing || !display) { setPillIdle(); return; }
    pill.classList.add("live");
    var name = display.name || (I18N[LANG].display + " " + (display.id + 1));
    var text = name + " · " + display.width + "×" + display.height;
    if (display.primary) text += " (" + I18N[LANG].primary + ")";
    pillText.textContent = text;
  }
  setPillIdle();
  waitingText.textContent = I18N[LANG].waiting;
  connState.textContent = I18N[LANG].reconnecting;

  // ---------- toasts ----------
  function showToast(text, durationSecs) {
    if (!text) return;
    // Banner lifetime comes from the host (seconds); fall back to 8s for
    // older hosts that do not send a duration.
    var dur =
      (typeof durationSecs === "number" && durationSecs >= 1
        ? durationSecs
        : 8) * 1000;
    var el = document.createElement("div");
    el.className = "toast";
    // Speaker glyph in front of the message; text goes through textContent
    // so notice content stays escaped.
    var icon = document.createElement("span");
    icon.className = "toast-icon";
    icon.innerHTML =
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5v5h3.1l4.6 3.9V5.6L7.6 9.5H4.5z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>';
    var label = document.createElement("span");
    label.textContent = text;
    el.appendChild(icon);
    el.appendChild(label);
    toasts.appendChild(el);
    setTimeout(function () {
      el.style.transition = "opacity 0.4s ease";
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 450);
    }, dur);
  }

  connect();
})();
</script>
</body>
</html>
